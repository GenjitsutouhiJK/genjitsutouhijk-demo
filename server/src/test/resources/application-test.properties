# 测试专用的配置（会被 src/test/resources/application-test.properties 这个位置自动识别）
#
# 用法：在测试类上写 @ActiveProfiles("test")，下面这些值就会覆盖 application.properties 里的同名项。
#
# 关键点：测试用**内存**数据库（jdbc:h2:mem:...），而开发用文件数据库（jdbc:h2:file:...）。
# 这样跑测试不会弄脏你自己的开发数据 —— 否则测试每次都往 users 表插数据，
# 跑个十遍就会有十个 admin，还互相冲突。

# mem: 表示数据库只存在内存里，进程一退就没了
# DB_CLOSE_DELAY=-1 表示"连接全断了也别关掉数据库"，否则连接池一空闲数据库就被清空
spring.datasource.url=jdbc:h2:mem:genjitsutouhijk-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 测试里不需要 H2 网页控制台
spring.h2.console.enabled=false

# 保持和开发环境一致：表结构由 Flyway 的迁移脚本建，Hibernate 只做校验。
# 这一点很重要 —— 它意味着每次跑测试，你的迁移脚本都会被真正执行一遍，
# 如果 SQL 写错了，测试立刻就会失败，不用等到部署才发现。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
