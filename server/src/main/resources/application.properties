# ===================== 应用 =====================
spring.application.name=genjitsutouhijk-demo


# ===================== 数据库连接 =====================
# H2 用的是"文件模式"：整个数据库就是一个文件，重启不丢数据，
# 但不需要安装任何数据库服务、不用起进程、不用配账号权限。
# 下面这行是以后换数据库时唯一要动的地方（换成 MySQL / PostgreSQL 就是换掉它）。
spring.datasource.url=jdbc:h2:file:./data/genjitsutouhijk-demo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# ===================== H2 网页控制台 =====================
# 启动后浏览器打开 http://localhost:8080/h2-console 就能直接看表里的数据。
# 登录界面上：JDBC URL 填上面那行 datasource.url，用户名填 sa，密码留空。
spring.h2.console.enabled=true


# ===================== JPA / Hibernate =====================
# ★ 这一行很关键：建表、改表全部交给 Flyway 的 SQL 脚本，
#   Hibernate 只负责"检查实体类和真实表结构对不对得上"，对不上就启动失败。
#   千万不要改成 update —— 它会背着你悄悄改表结构，你就永远学不到表是怎么建起来的。
spring.jpa.hibernate.ddl-auto=validate
# 把 Hibernate 实际发给数据库的 SQL 打到控制台，
# 这样用 JPA 也能看清"这一次查询到底执行了什么"。
spring.jpa.show-sql=true


# ===================== Flyway =====================
# Flyway 启动时会扫描这个目录下的 V*.sql，按版本号顺序执行，并记录哪些已经跑过。
# 其实这是默认值，写出来是为了让你一眼看到迁移脚本放在哪。
spring.flyway.locations=classpath:db/migration


# ===================== JWT =====================
# 这两项由 config/JwtProperties.java 读取，再由 security/JwtService.java 用来签发 token。

# 签名密钥。★ 长度至少 32 个字符（HS256 要求 256 位密钥），
# 太短的话 JJWT 会在启动时直接抛 WeakKeyException，故意不让你跑起来 ——
# 因为弱密钥等于没有签名，别人可以自己伪造任意用户的 token。
#
# ⚠️ 下面这个是**开发用的占位值**，它已经出现在 git 仓库里了，所以它不是什么秘密。
#    真实部署时**必须**换成只有自己知道的随机串，而且不要提交进版本库。
#    生产环境的正确姿势是走环境变量覆盖，配置文件里不写真实值：
#        set APP_JWT_SECRET=<你的随机串>     （Windows）
#        export APP_JWT_SECRET=<你的随机串>   （Linux/macOS）
#    Spring Boot 会自动把环境变量 APP_JWT_SECRET 映射到 app.jwt.secret，
#    而且**环境变量的优先级高于配置文件**，不用改任何代码。
#    生成随机串可以用：openssl rand -base64 48
app.jwt.secret=dev-only-secret-please-change-me-in-production-0123456789

# token 有效期，单位秒。3600 = 1 小时。
# 为什么不能设很长（比如 30 天）？
#   因为无状态 JWT **签发出去就没法单独作废**，只能等它自己过期。
#   有效期越长，token 万一泄露（XSS、日志、截图），攻击者能用的时间就越久。
# 那设很短（比如 5 分钟）行不行？
#   行，但用户会频繁被踢回登录页。业界常见做法是"短 access token + 长 refresh token"，
#   即 access token 很快过期，但可以用 refresh token 悄悄换一张新的。
#   本项目先不做 refresh token，1 小时是"安全"和"不烦人"之间的折中。
app.jwt.expires-in-seconds=3600
