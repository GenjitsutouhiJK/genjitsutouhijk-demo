<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GENJITSUTOUHIJK / TERMINAL</title>

    <!-- ============================================================
         地址栏配色（**不是图标**，别跟着图标一起删）
         ============================================================
         安卓 Chrome 拿它给地址栏 / 任务卡片上色。取值取自 Terminal 皮肤的墨色，
         与 src/styles/tokens.css 里的 `--ink` 是同一个值。

         ⚠️ 2026-10-09 按用户要求移除了整套站点图标：
            web/public/（favicon.ico / favicon.svg / apple-touch-icon.png /
            icon-{16,32,48,180,192,512}.png / site.webmanifest）、生成脚本
            scripts/build-icons.py，以及本文件里的 4 个 <link>。
            现无任何 <link rel="icon">，标签页显示浏览器默认图标。
         ⚠️ 浏览器仍会自动请求 /favicon.ico → dev 控制台会有一条 404，无功能影响。
            想消掉它，加一行 `<link rel="icon" href="data:," />` 即可（空图标，非文件）。
         ============================================================ -->
    <meta name="theme-color" content="#3e4247" />

    <!-- ============================================================
         主题预置：消除首屏闪跳
         ============================================================
         必须在样式生效**之前**就把 data-theme 写到 <html> 上。
         否则用户选了 Blueprint、一刷新，页面会先按默认的 Terminal 画一帧，
         再跳成蓝色 —— 表现为一次明显的"灰→蓝"闪动。

         ⚠️ 这段不能搬进 main.js：那是 module 脚本，要等 HTML 解析完才执行，
            中间那几十毫秒正好就是闪跳窗口。

         ⚠️ 键名 'gj-theme' 和取值 'blueprint' 与 src/utils/theme.ts 里是同一套。
            改那边的话，这里要一起改（只有这一处重复，刻意保留 ——
            为了消除闪跳，这点重复是值得的）。
         ============================================================ -->
    <script>
      try {
        if (localStorage.getItem('gj-theme') === 'blueprint') {
          document.documentElement.setAttribute('data-theme', 'blueprint')
        }
      } catch (e) {
        /* 隐私模式下读写 localStorage 会抛异常。忽略即可：
           默认皮肤不依赖任何脚本，照常工作。 */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
